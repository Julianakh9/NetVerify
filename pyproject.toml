[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netverify"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
netverify = "netverify.cli:run"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "netns: needs Linux network namespaces (root or passwordless sudo); skipped elsewhere unless NETVERIFY_REQUIRE_NETNS=1",
]
